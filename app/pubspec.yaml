name: dashboard_autostylo
description: "Dashboard Auto Stylo em Flutter Web (cópia do Power BI)."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  fl_chart: ^1.3.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_autostylo.png

  fonts:
    - family: RobotoLocal
      fonts:
        - asset: assets/fontes/Roboto-Regular.ttf
        - asset: assets/fontes/Roboto-Bold.ttf
          weight: 700
